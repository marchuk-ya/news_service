{{define "news/view.html"}}
<div class="max-w-2xl mx-auto">
    <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
        
        <div class="text-gray-500 text-sm mb-6">
            <p>Title: {{.News.Title}}</p>
            <p>Content: {{.News.Content}}</p>
            <p>Created: {{.News.CreatedAt.Format "2006-01-02 15:04:05"}}</p>
            <p>Last updated: {{.News.UpdatedAt.Format "2006-01-02 15:04:05"}}</p>
        </div>

        <div class="flex justify-between items-center">
            <a href="/" class="text-blue-500 hover:text-blue-700">
                Back to List
            </a>
            <div class="flex gap-2">
                <a href="/news/{{.News.ID}}/edit" 
                   class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
                    Edit
                </a>
                <form action="/news/{{.News.ID}}/delete" method="POST" class="inline">
                    <button type="submit" 
                            onclick="return confirm('Are you sure you want to delete this news?')"
                            class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                        Delete
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{{end}}
